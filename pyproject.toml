[project]
name = "TeSS-Metadata-Extractor-Agent"
version = "0.1.0"
description = "Metadata Extractor Agent for TeSS"
authors = [
    {name = "Kenneth Rioja", email = "kenneth.brian.rioja@cern.ch"},
    {name = "Hugo Bacard", email = "hugo.bacard@ijclab.in2p3.fr"},
]
dependencies = ["crawl4ai>=0.8.6", "openai>=2.36.0", "python-dotenv>=1.2.2", "pyyaml>=6.0.3", "pydantic>=2.13.4"]
requires-python = ">=3.12,<3.14"
readme = "README.md"
license = {text = "CC-4.0"}


[tool.pdm]
distribution = false

[dependency-groups]
dev = [
    "requests>=2.33.1",
    "bs4>=0.0.2",
    "black>=26.3.1",
    "ruff>=0.15.12",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
